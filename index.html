function editRoadEvent(x, isNew, opts = {}) {
  return new Promise(res => {
    const d = x; d.choices = d.choices || [];
    openSheet({ title: opts.title ? opts.title(isNew) : isNew ? 'New road event' : 'Road event',
      footer: `<button class="btn ghost" data-r="0">Cancel</button>${isNew ? '' : '<button class="btn danger" data-r="del">Delete</button>'}<button class="btn seal" data-r="1">Save</button>`,
      onClose: v => res(v || null),
      onMount: sh => {
        const sync = () => {
          const v = readInputs($('.form', sh.body));
          Object.assign(d, { title: v.title, kind: v.kind, text: v.text });
          if ('where' in v) d.where = v.where; if ('weight' in v) d.weight = Math.max(0, Math.round(num(v.weight))); if ('side' in v) d.side = v.side;
          if ('req' in v) d.req = String(v.req).trim(); if ('once' in v) d.once = !!v.once; if ('lean' in v) d.lean = !!v.lean;
          if (opts.read) opts.read(v, d);
          d.choices.forEach((c, i) => Object.assign(c, { label: v[`c${i}_label`], cost: Math.max(0, Math.round(num(v[`c${i}_cost`]))), chance: clamp(Math.round(num(v[`c${i}_chance`])), 0, 100),
            req: v[`c${i}_req`].trim(), text: v[`c${i}_text`], fx: v[`c${i}_fx`], failText: v[`c${i}_failText`], failFx: v[`c${i}_failFx`] }));
        };
        const draw = () => { sh.body.innerHTML = `<form class="form" onsubmit="return false">
          ${fieldHtml({ key: 'title', label: 'Title', value: d.title })}
          ${opts.threat ? fieldHtml({ key: 'kind', label: 'Kind', type: 'select', value: d.kind, options: Object.entries(EV_KINDS) }) + opts.fields(d) : `
          <div class="two">${fieldHtml({ key: 'kind', label: 'Kind', type: 'select', value: d.kind, options: Object.entries(EV_KINDS) })}${fieldHtml({ key: 'weight', label: 'Weight', type: 'stepper', value: d.weight, min: 0, max: 20 })}</div>
          ${fieldHtml({ key: 'where', label: 'Where', type: 'select', value: d.where || '', options: regionOpts() })}
          <div class="two">${fieldHtml({ key: 'side', label: 'Only for', type: 'select', value: d.side || '', options: [['', 'Either expedition'], ['sig', exShort('sig')], ['ulr', exShort('ulr')]] })}${fieldHtml({ key: 'req', label: 'Requires', value: d.req || '', placeholder: 'e.g. helped_kelham' })}</div>
          ${fieldHtml({ key: 'once', type: 'toggle', label: 'Happens only once per expedition', value: d.once })}
          ${fieldHtml({ key: 'lean', type: 'toggle', label: 'Daemon-touched: twice as likely for the deceived priest’s expedition', value: d.lean })}
          ${opts.fields ? opts.fields(d) : ''}`}
          ${fieldHtml({ key: 'text', label: 'Text', type: 'textarea', value: d.text, hint: 'You can write {pin}, {region}, {ex}, {rival}, {god}, {priest}, {captain} and {patron}.' })}
          ${FX_HELP}
          ${d.choices.map((c, i) => `<div class="card choice-ed"><div class="row between"><b class="sc">Choice ${i + 1}</b><button type="button" class="btn sm danger" data-rm="${i}">Remove</button></div>
            ${fieldHtml({ key: `c${i}_label`, label: 'Label', value: c.label })}
            <div class="two">${fieldHtml({ key: `c${i}_cost`, label: 'Cost (gc)', type: 'number', value: c.cost || 0 })}${fieldHtml({ key: `c${i}_chance`, label: 'Chance % (0 = certain)', type: 'number', value: c.chance || 0 })}</div>
            ${fieldHtml({ key: `c${i}_req`, label: 'Requires', value: c.req || '' })}
            ${fieldHtml({ key: `c${i}_text`, label: 'Outcome text', type: 'textarea', value: c.text })}
            ${fieldHtml({ key: `c${i}_fx`, label: 'Effects', value: c.fx, placeholder: 'e.g. gold 30; flag helped' })}
            ${fieldHtml({ key: `c${i}_failText`, label: 'If the roll fails: text', type: 'textarea', value: c.failText })}
            ${fieldHtml({ key: `c${i}_failFx`, label: 'If the roll fails: effects', value: c.failFx })}</div>`).join('')}
          <button type="button" class="btn block" data-add="1">+ Add a choice</button></form>`; };
        draw();
        sh.body.addEventListener('click', e => {
          const rm = e.target.closest('[data-rm]'), ad = e.target.closest('[data-add]');
          if (rm) { sync(); d.choices.splice(+rm.dataset.rm, 1); draw(); }
          if (ad) { sync(); d.choices.push(EVc('New choice')); draw(); }
        });
        sh.foot.addEventListener('click', async e => {
          const b = e.target.closest('[data-r]'); if (!b) return;
          if (b.dataset.r === '0') return sh.close();
          if (b.dataset.r === 'del') { if (await confirmBox({ title: 'Delete this event?', danger: true, ok: 'Delete', text: `<p>${esc(d.title)}</p>` })) sh.close('delete'); return; }
          sync(); if (!d.title.trim()) return toast('Give it a title');
          if (!d.choices.length) d.choices.push(EVc('Onward'));
          sh.close(d);
        });
      } });
  });
}

/* Idempotent: adds the phase 4 tables and fields, never touches rosters, regions, pins or existing tables. */
function seedPhase4(c) {
  const t = c.tables = c.tables || {};
  if (!Array.isArray(t.campEvents)) t.campEvents = clone(DEFAULT_CAMP_EVENTS);
  if (!Array.isArray(t.threatEvents)) t.threatEvents = clone(DEFAULT_THREAT_EVENTS);
  if (!Array.isArray(t.omens)) t.omens = clone(DEFAULT_OMENS);
  if (!Array.isArray(t.cultTwists)) t.cultTwists = clone(DEFAULT_CULT_TWISTS);
  // "A Troubling Dream" becomes daemon-touched (likelier for the deceived priest). Adds a field only.
  const dream = (t.investigate || []).find(x => x && x.id === 'dream');
  if (dream && dream.lean === undefined) dream.lean = true;
  const th = c.threat = c.threat && typeof c.threat === 'object' ? c.threat : {};
  th.rival = Math.max(0, Math.round(num(th.rival))); th.cult = Math.max(0, Math.round(num(th.cult)));
  for (const k of ['fired', 'log', 'pending', 'done']) th[k] = Array.isArray(th[k]) ? th[k] : [];
  c.omens = Array.isArray(c.omens) ? c.omens : [];
  c.camp = c.camp && typeof c.camp === 'object' ? c.camp : {};
  if (c.reveal === undefined) c.reveal = null;
  const f = c.finale = c.finale && typeof c.finale === 'object' ? c.finale : {};
  f.quest = f.quest && typeof f.quest === 'object' ? f.quest : {};
  if (f.smith === undefined) f.smith = null; if (f.winner === undefined) f.winner = null;
  seedPhase41(c);
  c.schema = Math.max(c.schema || 1, 4);
  seedPhase5(c);   // schema 4 → 5: backup reminders, warband points
  return c;
}

/* ---------- the daemon's secret: read only to weight omens, and in the reveal ---------- */
function deceivedNow() { try { const x = C && C.seal ? unsealSecret(C.seal, sealKey(C)) : null; return x && SIDES.includes(x.t) ? x.t : null; } catch (e) { return null; } }

/* ---------- threat track ---------- */
const threatEntry = id => (C.tables.threatEvents || []).find(x => x && x.id === id) || null;
const trackMax = tr => Math.max(12, ...(C.tables.threatEvents || []).filter(x => x && x.track === tr).map(x => num(x.at)));
function addThreat(tr, n, why, s) {
  const T = C.threat; if (!TRACKS[tr] || !n || !trackOn(tr)) return;
  const before = T[tr] || 0; T[tr] = clamp(before + n, 0, 99);
  if (T[tr] === before) return;
  T.log.push({ turn: C.turn, track: tr, from: before, to: T[tr], why: why || '', side: s || null });
  if (T.log.length > 300) T.log.splice(0, T.log.length - 300);
  if (T[tr] < before) T.fired = T.fired.filter(k => { if (!k.startsWith(tr + ':')) return true; const e = threatEntry(k.slice(tr.length + 1)); return !e || num(e.at) <= T[tr]; });
}
const liveSides = () => SIDES.filter(s => EX(s).status !== 'lost');
function leaderSide(trailing) {
  const L = liveSides(); if (L.length < 2) return L[0] || null;
  const sc = s => shardsHeld(s) * 100 + ((EX(s).record || {}).win || 0);
  if (sc('sig') === sc('ulr')) return pickOne(L);
  const lead = sc('sig') > sc('ulr') ? 'sig' : 'ulr';

}
function threatTargets(t, ctx = {}) {

}
function checkThresholds(ctx = {}) {
  const T = C.threat, out = [];
  for (const tr of tracksOn()) {
    const list = (C.tables.threatEvents || []).filter(x => x && x.track === tr && num(x.at) > 0).sort((a, b) => num(a.at) - num(b.at));
    for (const e of list) {
      const key = tr + ':' + e.id;
      if ((T[tr] || 0) < num(e.at) || T.fired.includes(key)) continue;
      T.fired.push(key);
      const who = threatTargets(e.target, ctx);
      for (const s of who) { const rec = { id: uid('thr'), eid: e.id, track: tr, side: s, turn: C.turn, title: e.title, resolved: false }; T.pending.push(rec); out.push(rec); }
      if (who.length) chron(null, 'threat', `${tr === 'cult' ? 'The daemon’s cult grew bolder' : 'The court’s agents moved in the shadows'}, and turned on ${who.map(s => theN(exName(s), false)).join(' and ')}: ${e.title}.`, { tag: e.title });

        T.fired = T.fired.filter(k => { if (!k.startsWith(tr + ':')) return true; const x = threatEntry(k.slice(tr.length + 1)); return x && num(x.at) <= rv; });

}

}

/* ---------- requirements, extended: "a|b", "cult>=6", "turn>=10", "shards>=3", "held>=2", "revealed" ---------- */
function reqAtom(k, s) {
  const m = k.match(/^(gold|cult|rival|turn|shards|held)\s*(>=|<=|>|<|=)\s*(-?\d+)$/i);
  if (m) {
    const v = { gold: EX(s).gold, cult: C.threat.cult || 0, rival: C.threat.rival || 0, turn: C.turn, shards: shardsTotalFound(), held: shardsHeld(s) }[m[1].toLowerCase()], n = +m[3];
    return { '>=': v >= n, '<=': v <= n, '>': v > n, '<': v < n, '=': v === n }[m[2]];
  }

    return neg ? !v : v;

      <div id="evChoices">${rec.resolved ? `<div class="chosen">${esc(rec.choice || '')}</div>` : choices.map((c, i) => {
        const cost = num(c.cost), poor = EX(s).gold < cost, ok = reqOk(c.req, s), can = ok && !poor;
        const info = [cost ? `Costs ${cost} gc` : '', num(c.chance) > 0 && num(c.chance) < 100 ? `${num(c.chance)}% chance` : '', poor ? 'not enough gold' : '', !ok ? 'not available' : ''].filter(Boolean).join(' · ');
        return `<button class="pick" data-c="${i}" ${can ? '' : 'disabled'}><b>${esc(fill(c.label, s, r, p))}</b>${info ? `<div class="muted">${info}</div>` : ''}</button>`; }).join('')}</div>
      <div id="evOut">${rec.resolved ? outHtml() : ''}</div>`,

/* ---------- the runesmith and the Forge of Alaric ---------- */
function forgeLoc() {
  const F = S().finale; let r = [regionById(F.regionId), regionById('worlds_edge')].find(x => x && inPlay(x) && x.pins.length) || null;
  let p = r && (pinOf(r, F.pinId) || r.pins.find(x => /zhufbar/i.test(x.name)) || r.pins.find(x => x.terrain === 'fortress') || r.pins[0]);
  if (!p) { const play = C.regions.filter(x => inPlay(x) && x.pins.length); r = play[0] || C.regions.find(x => x.pins.length) || null;
    const homes = new Set(SIDES.map(s => ((EX(s).trail || [])[0] || {}).pinId)), ok = r ? r.pins.filter(x => !homes.has(x.id)) : [];
    p = r ? (ok.find(x => x.terrain === 'fortress') || ok.find(x => x.terrain === 'town') || ok[0] || r.pins[0]) : null; }
  return { r, p };

function seekSmith() {

const MINOR_KINDS = new Set(['gold', 'replenish', 'hire', 'heal', 'roster', 'rank', 'loot', 'turn', 'mission']);

const ORD = ['', 'First', 'Second', 'Third', 'Fourth', 'Fifth', 'Sixth', 'Seventh', 'Eighth', 'Ninth', 'Tenth', 'Eleventh', 'Twelfth', 'Thirteenth', 'Fourteenth', 'Fifteenth', 'Sixteenth', 'Seventeenth', 'Eighteenth', 'Nineteenth', 'Twentieth'];

}

async function newCampaignFlow() {
  if (!await confirmBox({ title: 'Begin anew?', text: '<p>Start a fresh campaign with fresh rosters? Export first if you want to keep the current one. An undo copy is kept on this phone too.</p>', ok: 'Continue', danger: true })) return;

/* ---------- backup reminders: a quiet card, and one prompt after the Revelation and the finale ---------- */
const REMIND_TURNS = 4;
function backupMoment(why, side, prompt) {
  if (!C) return;
  const B = C.backup || (C.backup = {});
  B.moment = { why, side: side || null, turn: C.turn, ts: Date.now() };
  if (prompt) UI.nudge = why;
}
function backupDue() {
  if (!C || !C.backup) return null;
  const B = C.backup, last = num(C.lastExport, 0);
  if (last && num(C.updated) <= last) return null;            // nothing has changed since the last export
  const m = B.moment;
  if (m && m.ts >= last && m.ts > num(B.snoozeAt, 0)) return { why: m.why, side: m.side };
  const from = B.lastTurn == null ? 1 : num(B.lastTurn, 1), base = Math.max(from, num(B.snoozeTurn, 0));
  if (C.turn - base >= REMIND_TURNS) return { why: 'turns', n: C.turn - from, never: !C.lastExport };
  return null;
}

function visitsIn(r) {
  const out = new Map();
  for (const s of SIDES) for (const t of EX(s).trail || []) {
    if (!t || t.regionId !== r.id) continue;
    const p = pinOf(r, t.pinId); if (!p && t.x == null) continue;
    const key = p ? p.id : `xy:${t.x},${t.y}`;
    const v = out.get(key) || { p, x: p ? p.x : t.x, y: p ? p.y : t.y, sides: new Set(), turns: [] };
    v.sides.add(s); v.turns.push(t.turn); out.set(key, v);
  }
  return [...out.values()];
}
function journeyRegionMarkers(r) {

  here.forEach(s => { const p = pinOf(r, EX(s).pos.pinId); out.push({ id: 'tok-' + s, x: p.x, y: p.y, hit: false, cls: 'mk-token', html: tokenHtml(s, both ? (s === 'sig' ? -15 : 15) : 0) }); });

      <li><b>The blades stay put:</b> shards never move once hidden. A lost last mission or the agents only break the trail.</li>
      <li><b>Keep our world:</b> a new campaign keeps your map images, regions, pins, edited tables and house rules.</li></ul>`)}
    ${sec('phones', 'Two Phones and Backups', `<p>The campaign lives on one phone at a time. After a session, <b>Export</b> it (Codex → Backup & sharing) and <b>Import</b> the file on the other phone. Importing replaces the campaign there, and keeps the old one as an undo copy.</p>
      <p class="small muted">The app reminds you to back up after ${REMIND_TURNS} turns without an export, and after a shard is taken, the Revelation and the finale.</p>`)}
    ${sec('install', 'Install and Offline', `<p><b>Android:</b> in Chrome, open the ⋮ menu and choose <b>Install app</b> (or use the Install button in the Codex).</p>
      <p><b>iPhone:</b></p>${IOS_STEPS}<p class="small muted">${IOS_NOTE}</p>
      <p>Once installed, Runefang works in airplane mode. When a new version is out, a bar offers <b>Update</b>: tap it at a quiet moment (the campaign is saved first), or ignore it and the update arrives the next time the app is fully closed.</p>`)}
    </div>`;
}

/* ---------- actions ---------- */
Object.assign(ACT, {
  goHelp: () => { if (!PREFS.helpSeen) { PREFS.helpSeen = true; savePrefs(); } go('help'); },
  helpJump: (el, e) => { const t = document.getElementById('h-' + el.dataset.k); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  textSize: el => { PREFS.text = el.dataset.v === 'large' ? 'large' : 'normal'; applyPrefs(); savePrefs(); render(); setTopH(); },
  remindLater: () => { const B = C.backup || (C.backup = {}); B.snoozeAt = Date.now(); B.snoozeTurn = C.turn; save(); render(); toast(`I’ll remind you again in ${REMIND_TURNS} turns, or after the next big moment`, 3200); },
  hideInstall: () => { PREFS.installHidden = true; savePrefs(); render(); },
  install: async () => { const e = INSTALL_EVT; if (!e) return; INSTALL_EVT = null; try { await e.prompt(); await e.userChoice; } catch (er) {} render(); },
  journey: () => { UI.journey = !UI.journey; UI.pinSetup = false; UI.pinMove = null; UI.arrange = false; render(); },
});


const setTopH = () => { try { document.documentElement.style.setProperty('--toph', $('#top').offsetHeight + 'px'); } catch (e) {} };
window.addEventListener('resize', setTopH);

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  await DB.open();
  await loadPrefs();
  let c = null, readErr = null;
  for (let i = 0; i < 3; i++) {
    try { c = await DB.get('kv', 'campaign'); readErr = null; break; } catch (e) { readErr = e; console.warn(e); await new Promise(r => setTimeout(r, 300)); }
  }
  if (readErr) {
    // Never write over a save we could not read: show a blank campaign but don't save it.
    C = newCampaign(); BOOT_READ_FAILED = true; render();
    return alertBox('Could not open your campaign', '<p>The phone would not let the app read its saved campaign. Nothing has been changed or deleted.</p><p>Close the app completely (swipe it away) and open it again. If this keeps happening, restore from an exported backup.</p>');
  }
  const fresh = !c;
  if (!c) { c = newCampaign(); C = c; dirty = true; await flush(); }
  const was = c.schema;
  C = migrate(c);
  if (was !== C.schema) { dirty = true; await flush(); }
  UI.side = C.active;
  if (DB.fallback) toast('App storage unavailable. Export often!', 5000);
  render();
  requestPersist();
  if (!fresh) cleanOrphanImages();
}
boot();

/* PWA service worker.
   A new version waits until the player taps Update (the campaign is saved first), or until the app is next fully closed.
   The page only reloads when the player asked for it: never on a first visit, never by itself mid-game. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', async () => {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register('sw.js');
      const bar = $('#upd'); let waiting = null, asked = false, reloading = false;
      const offer = w => { waiting = w; if (!UI.updLater) bar.classList.add('show'); };
      $('#updLater').onclick = () => { bar.classList.remove('show'); UI.updLater = true; toast('It will install the next time the app is fully closed and opened again.', 4200); };
      $('#updGo').onclick = async () => {
        if (!waiting) return;
        if (Sheets.stack.length) {
          if (!await confirmBox({ title: 'Update now?', ok: 'Update', text: '<p>The window you have open will close, and anything typed in it but not saved is lost. The campaign itself is saved first.</p>' })) return;
          [...Sheets.stack].reverse().forEach(sh => sh.close());
          await new Promise(r => setTimeout(r, 700));   // let the back-button history settle, or it would cancel the reload
        }
        asked = true; bar.classList.remove('show'); toast('Updating…', 10000);
        try { await flush(); } catch (e) {}
        waiting.postMessage('skipWaiting');
        setTimeout(() => { if (!reloading) { reloading = true; location.reload(); } }, 5000);
      };
      if (reg.waiting && hadController) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (asked && !reloading) { reloading = true; location.reload(); } });
      // An installed app can stay open for days: look for a new version when it comes back to the front (at most every 30 minutes).
      let lastCheck = Date.now();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible' || Date.now() - lastCheck < 30 * 60000 || navigator.onLine === false) return;
        lastCheck = Date.now(); reg.update().catch(() => {});
      });
    } catch (e) { console.warn('SW registration failed', e); }
  });
}
</script>
