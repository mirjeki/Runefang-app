  e.trail.push({ regionId: r.id, pinId: p.id, x: p.x, y: p.y, turn: C.turn, ts: Date.now() });
  if (e.trail.length > 300) e.trail.splice(0, e.trail.length - 300);
  chron(s, 'march', `${e.name} marched to ${p.name}${p.name.includes(r.short || r.name) ? '' : ' in ' + (r.short || r.name)}.`);
  save(); refreshMap(); toast(`${exShort(s)} Expedition marched to ${p.name}`);
}
function stepBack(s) {
  const e = EX(s); if (e.trail.length < 2) return toast('Nowhere to step back to');
  const gone = e.trail.pop(), prev = e.trail[e.trail.length - 1];
  e.pos = { regionId: prev.regionId, pinId: prev.pinId };
  const r = regionById(gone.regionId), p = pinOf(r, gone.pinId);
  chron(s, 'note', `Correction: ${e.name} did not march to ${p ? p.name : 'that place'} after all.`);
  save(); render(); toast('Stepped back');
}
function regionSheet(r) {
  const rum = C.shards.filter(x => x.regionId === r.id);
  const here = SIDES.filter(s => EX(s).pos && EX(s).pos.regionId === r.id);
  const m = r.map;
  const shapeOff = m && Math.abs((m.w / m.h) / r.aspect - 1) > 0.04;
  openSheet({ title: r.name,
    html: `<p class="flavour">${esc(r.blurb || '')}</p>
      ${rum.length ? rum.map(x => `<div class="row small rumour"><span class="mini">${shardSvg(x.status)}</span><span>${x.status === 'rumoured' ? 'Rumoured here' : x.status === 'lost' ? 'Lost here' : 'Recovered here'}: <b>${esc(x.name)}</b></span></div>`).join('') : '<p class="small muted">No shard is rumoured here.</p>'}
      <h3 class="sc" style="margin-top:14px">Map image</h3>
      <div class="card" style="margin:6px 0">${m ? `<div class="row">${m.thumb ? `<img class="thumbbig" src="${m.thumb}" alt="">` : ''}<div class="grow small">${m.w} × ${m.h} px · ${MB(m.bytes || 0)}<br><span class="muted">${esc(m.name || '')}</span>${shapeOff ? `<div style="color:var(--warn)">Shape differs from the seeded layout (${ratioTxt(r.aspect)}). Check the pins.</div>` : ''}</div></div>` : `<p class="small muted" style="margin-top:0">No image yet. Expected shape: ${ratioTxt(r.aspect)}.</p>`}
        <div class="btns" style="margin-top:8px"><button class="btn seal" data-a="upload">${m ? 'Replace image' : 'Add map image'}</button>${m ? '<button class="btn danger" data-a="rmimg">Remove</button>' : ''}</div></div>
      <h3 class="sc" style="margin-top:14px">Pins (${r.pins.length})</h3>
      <div class="card" style="margin:6px 0;padding:4px 12px">${r.pins.map(p => `<div class="listed tap" data-a="goto" data-id="${p.id}" style="cursor:pointer"><span class="pin static sm" style="background:${facColor(p.faction)}">${terrIcon(p.terrain)}</span><span class="grow">${esc(p.name)}</span><span class="small muted">${esc((TERRAIN[p.terrain] || {}).label || '')}</span></div>`).join('') || '<div class="empty">No pins. Use Pin Setup.</div>'}</div>
      <div class="btns"><button class="btn" data-a="setup">Pin Setup</button>${r.pins.some(p => p.seeded) || REGION_SEED.some(x => x[0] === r.id) ? '<button class="btn" data-a="reseed">Restore seeded pins</button>' : ''}</div>
      ${here.length ? `<h3 class="sc" style="margin-top:14px">Expeditions here</h3>${here.map(s => { const l = locOf(s); return `<div class="listed">${shieldSvg(s)}<span class="grow">${esc(exShort(s))} at ${esc(l && l.pin ? l.pin.name : 'no pin')}</span><button class="btn sm" data-a="back" data-s="${s}">Step back</button></div>`; }).join('')}` : ''}
      <h3 class="sc" style="margin-top:14px">Region details</h3>
      <form class="form" onsubmit="return false">
        ${fieldHtml({ key: 'name', label: 'Name', value: r.name })}
        ${fieldHtml({ key: 'short', label: 'Short name', value: r.short || '' })}
        ${fieldHtml({ key: 'danger', label: 'Danger (1–5)', type: 'stepper', value: r.danger, min: 1, max: 5 })}
        ${fieldHtml({ key: 'far', label: 'Far land (later in the campaign)', type: 'toggle', value: r.far })}
        <div class="f"><label class="l">Opposition here (weight 0–5)</label><div class="two">${Object.entries(FACTIONS).map(([k, f]) => `<div><div class="small" style="margin-bottom:3px">${esc(f.label)}</div>${stepperHtml('fac_' + k, r.factions[k] || 0, 0, 5)}</div>`).join('')}</div>
          <div class="hint">Missions in phase 3 pick opponents by these weights.</div></div>
        ${fieldHtml({ key: 'blurb', label: 'Description', type: 'textarea', value: r.blurb || '' })}
        ${fieldHtml({ key: 'notes', label: 'Notes', type: 'textarea', value: r.notes || '' })}
      </form>
      <button class="btn block danger" data-a="delregion" style="margin-top:8px">Delete this region…</button>`,
    footer: `<button class="btn ghost" data-r="0">Close</button><button class="btn seal" data-r="1">Save details</button>`,
    onMount: sh => {
      sh.foot.addEventListener('click', e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        if (b.dataset.r === '1') {
          const v = readInputs(sh.body);
          r.name = v.name.trim() || r.name; r.short = v.short.trim() || r.name; r.danger = clamp(Math.round(v.danger) || 1, 1, 5); r.far = !!v.far;
          for (const k in FACTIONS) { const w = clamp(Math.round(v['fac_' + k] || 0), 0, 5); if (w) r.factions[k] = w; else delete r.factions[k]; }
          r.blurb = v.blurb; r.notes = v.notes; save(); toast('Region saved', 1400);
        }
        sh.close(); render();
      });
      sh.body.addEventListener('click', async e => {
        const b = e.target.closest('[data-a]'); if (!b) return;
        const a = b.dataset.a;
        if (a === 'upload') { sh.close(); uploadMap({ kind: 'region', r }); }
        if (a === 'rmimg') { sh.close(); removeMap({ kind: 'region', r }); }
        if (a === 'setup') { sh.close(); UI.pinSetup = true; render(); }
        if (a === 'goto') { const p = pinOf(r, b.dataset.id); sh.close(); if (p && MV) { MV.focus(p.x, p.y, 3); setTimeout(() => pinSheet(r, p), 260); } }
        if (a === 'back') { sh.close(); stepBack(b.dataset.s); }
        if (a === 'reseed') {
          if (!await confirmBox({ title: 'Restore seeded pins?', text: '<p>Put every seeded pin back in its original place, and re-add any you deleted. Pins you added yourself are kept.</p>', ok: 'Restore' })) return;
          const row = REGION_SEED.find(x => x[0] === r.id); if (!row) return;
          const fresh = seedRegion(row).pins;
          for (const fp of fresh) { const ex = r.pins.find(p => p.id === fp.id); if (ex) Object.assign(ex, { x: fp.x, y: fp.y }); else r.pins.push(fp); }
          save(); sh.close(); render(); toast('Seeded pins restored');
        }
        if (a === 'delregion') {
          if (!await confirmBox({ title: 'Delete region?', danger: true, ok: 'Delete region', text: `<p>Delete <b>${esc(r.name)}</b>, its ${plural(r.pins.length, 'pin')} and its map image? Shard rumours here become unknown.</p>` })) return;
          if (!await confirmBox({ title: 'Really delete?', danger: true, ok: 'Yes, delete it', text: '<p>This can’t be undone (except by importing a backup).</p>' })) return;
          if (r.map) { try { await DB.del('images', r.map.key); } catch (er) {} forgetImage(r.map.key); }
          C.regions = C.regions.filter(x => x !== r);
          C.shards.forEach(x => { if (x.regionId === r.id) { x.regionId = null; x.pinId = null; } });
          save(); sh.close(); if (UI.regionPushed) { UI.regionPushed = false; Sheets.skip++; history.back(); } UI.view = 'map'; render(); toast('Region deleted');
        }
      });
    } });
}
function ovSheet() {
  const m = C.overview.map;
  openSheet({ title: 'The Old World map',
    html: `<p class="small muted">The overview map with a seal for each region. Add your own image from the gallery or files; it is stored on this phone and travels in the export file.</p>
      <div class="card">${m ? `<div class="row">${m.thumb ? `<img class="thumbbig" src="${m.thumb}" alt="">` : ''}<div class="grow small">${m.w} × ${m.h} px · ${MB(m.bytes || 0)}<br><span class="muted">${esc(m.name || '')}</span></div></div>` : `<p class="small muted" style="margin-top:0">No image yet. Expected shape: ${ratioTxt(C.overview.aspect)}.</p>`}
      <div class="btns" style="margin-top:8px"><button class="btn seal" data-a="upload">${m ? 'Replace image' : 'Add Old World map'}</button>${m ? '<button class="btn danger" data-a="rm">Remove</button>' : ''}</div></div>
      <div class="btns" style="flex-direction:column"><button class="btn block" data-a="arrange">${UI.arrange ? 'Stop arranging regions' : 'Arrange regions (drag the seals)'}</button></div>`,
    onMount: sh => sh.body.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return; sh.close();
      if (b.dataset.a === 'upload') uploadMap({ kind: 'overview' });
      if (b.dataset.a === 'rm') removeMap({ kind: 'overview' });
      if (b.dataset.a === 'arrange') { UI.arrange = !UI.arrange; render(); }
    }) });
}
async function newRegionFlow() {
  const v = await formSheet({ title: 'New region', ok: 'Create', fields: [
    { key: 'name', label: 'Name', value: '', placeholder: 'e.g. Reikland' },
    { key: 'danger', label: 'Danger (1–5)', type: 'stepper', value: 2, min: 1, max: 5 },
    { key: 'far', label: 'Far land', type: 'toggle', value: false } ] });
  if (!v || !v.name.trim()) return;
  const name = v.name.trim(), c = MV ? MV.centerFrac() : { x: .5, y: .45 };
  const r = { id: slug(name) + '-' + Math.random().toString(36).slice(2, 6), name, short: name, aspect: 1.414, danger: clamp(Math.round(v.danger), 1, 5), far: !!v.far, home: null,
    hot: { x: clamp(c.x, 0, 1), y: clamp(c.y, 0, 1) }, factions: { bandits: 2 }, blurb: '', notes: '', map: null, pins: [] };
  C.regions.push(r); save(); toast('Region added. Drag its seal into place.'); UI.arrange = true; render();
}

Object.assign(ACT, {
  openRegion: el => openRegion(el.dataset.id),
  mapBack: () => { if (UI.regionPushed) history.back(); else go('map'); },
  regionInfo: () => { const r = regionById(UI.regionId); if (r) regionSheet(r); },
  zoomIn: () => MV && MV.zoomBy(1.6), zoomOut: () => MV && MV.zoomBy(1 / 1.6), zoomFit: () => MV && MV.fit(),
  pinSetup: () => { UI.pinSetup = !UI.pinSetup; UI.pinMove = null; render(); if (UI.pinSetup) toast('Tap the map to drop a pin', 1800); },
  cancelMove: () => { UI.pinMove = null; render(); },
  arrange: () => { UI.arrange = !UI.arrange; render(); },
  ovSheet, newRegion: newRegionFlow,
  openMap: () => go('map'), goChron: () => go('chron'), goCodex: () => go('more'),
});

const setTopH = () => { try { document.documentElement.style.setProperty('--toph', $('#top').offsetHeight + 'px'); } catch (e) {} };
window.addEventListener('resize', setTopH);

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  await DB.open();
  let c = null;
  try { c = await DB.get('kv', 'campaign'); } catch (e) { console.warn(e); }
  if (!c) { c = newCampaign(); C = c; dirty = true; await flush(); }
  const was = c.schema;
  C = migrate(c);
  if (was !== C.schema) { dirty = true; await flush(); }
  UI.side = C.active;
  if (DB.fallback) toast('App storage unavailable. Export often!', 5000);
  render();
  requestPersist();
  cleanOrphanImages();
}
boot();

/* PWA service worker */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const prompt = w => {
        const t = $('#toast'); t.style.pointerEvents = 'auto';
        t.innerHTML = 'A new version is ready. <button class="btn sm seal" id="swUpd" style="margin-left:8px">Update</button>';
        t.classList.add('show'); clearTimeout(toastT);
        $('#swUpd').onclick = () => { flush().then(() => w.postMessage('skipWaiting')); };
      };
      if (reg.waiting && navigator.serviceWorker.controller) prompt(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) prompt(w); }); });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
    } catch (e) { console.warn('SW registration failed', e); }
  });
}
</script>
</body>
