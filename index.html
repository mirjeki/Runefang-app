input,select,textarea{font:inherit;color:var(--ink)}

#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;
  background:linear-gradient(var(--leather2),var(--leather));color:#f2dfae;border-bottom:3px double #b9913f;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#top .brand{font-family:'Unifraktur',serif;font-size:1.55rem;line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .turn{font-family:'FellSC',serif;font-size:.95rem;text-align:right;line-height:1.15}
#savedot{width:10px;height:10px;border-radius:50%;background:#6c9a4a;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#savedot.saving{background:#d6ad2b}#savedot.err{background:#e0473a}

main{padding:14px 14px calc(var(--navh) + var(--safe-b) + 24px);max-width:720px;margin:0 auto}

/* nav */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(var(--navh) + var(--safe-b));padding-bottom:var(--safe-b);
  background:linear-gradient(var(--leather2),var(--leather));border-top:3px double #b9913f;box-shadow:0 -2px 8px rgba(0,0,0,.3)}
#tabs button{flex:1;border:0;background:none;color:#d9c08a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'FellSC',serif;font-size:.82rem}
#tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff3cf;background:radial-gradient(ellipse at 50% 0%,rgba(214,173,43,.35),transparent 70%)}
#tabs button.on span{border-bottom:2px solid #d6ad2b}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 6px rgba(70,40,10,.12);position:relative}
.card.edge{border-left:7px solid var(--acc,var(--line))}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99);background:var(--card2)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.title{font-weight:700;font-size:1.08rem;line-height:1.25}
.big{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.huge{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.center{text-align:center}
.rule{border:0;border-top:1px solid var(--line);margin:12px 0}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 4px}
.section-h h2{font-size:1.45rem}
.side-sig{--acc:var(--sig);--acc2:var(--sig2)}
.side-ulr{--acc:var(--ulr);--acc2:var(--ulr2)}

/* buttons */
.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink2);background:#f4e7c3;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;line-height:1.2}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.seal{background:linear-gradient(#ad2a22,#7b1714);color:#fcefd2;border-color:#4f0d0b;box-shadow:0 2px 0 #4f0d0b}
.btn.ink{background:linear-gradient(#4b3420,#2b1c0e);color:#f5e6c0;border-color:#1b1108}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.acc{background:var(--acc);border-color:rgba(0,0,0,.4);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;min-width:44px;padding:6px 10px}
.btn.round{width:48px;height:48px;padding:0;border-radius:50%;font-size:1.5rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1}
.linkbtn{background:none;border:0;color:var(--seal);font-weight:700;padding:10px 4px;min-height:44px;text-decoration:underline}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink2);border-radius:12px;overflow:hidden;background:#f3e5bf}
.seg button{min-height:48px;border:0;background:none;font-weight:700;padding:6px 4px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink2);color:#fbefd2}
.seg.sides button.on.s-sig{background:var(--sig);color:#fff8dc}
.seg.sides button.on.s-ulr{background:var(--ulr);color:#fff}
.sticky-seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;padding:6px 0 4px;margin:-6px 0 0;background:linear-gradient(var(--parch) 75%,transparent)}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fbf3dc;font-size:.88rem;margin:3px 4px 3px 0;line-height:1.3}
.chip .x{border:0;background:none;font-size:1.05rem;padding:0 0 0 4px;min-width:28px;min-height:28px;color:var(--bad)}
.st{font-family:'FellSC',serif;font-size:.85rem;padding:2px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.st-fit{background:var(--ok)}.st-wounded{background:var(--warn)}.st-out{background:#b0571b}.st-dead{background:var(--dead)}
.wax{display:inline-flex;align-items:center;gap:4px;background:radial-gradient(circle at 35% 30%,#c63a30,#7b1714);color:#fff3d6;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;box-shadow:0 1px 2px rgba(0,0,0,.4);border:0;min-height:36px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--ink2);background:transparent}
.pip.on{background:var(--gold);border-color:#6d5419}
.bar{height:9px;border-radius:6px;background:#dccaa0;overflow:hidden;border:1px solid #c2a874}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--acc,var(--ink2)),var(--acc,var(--ink2)));transition:width .2s}
.bar.xp>span{background:linear-gradient(90deg,#b8902e,#e2c15a)}
.shield{width:22px;height:26px;flex:none}
.priest-mark{color:var(--gold);font-weight:700}
.dead .title{text-decoration:line-through;color:var(--dead)}
.dead{opacity:.75}

/* forms */
.form .f{margin:14px 0}
.form label.l{display:block;font-family:'FellSC',serif;color:var(--ink2);margin-bottom:5px;font-size:1rem}
.form input[type=text],.form input[type=number],.form input:not([type]),.form select,.form textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fffaea}
.form textarea{min-height:90px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.form .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper input{text-align:center;font-weight:700;font-size:1.2rem;flex:1;min-width:0}
.stepper button{width:56px;min-height:48px;border-radius:10px;border:1.5px solid var(--ink2);background:#f4e7c3;font-size:1.5rem;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px}
.toggle input{width:26px;height:26px;accent-color:var(--seal)}
.listed{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.listed:last-child{border-bottom:0}

/* sheets */
#sheet-root{position:relative;z-index:50}
.sheet-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap .backdrop{position:absolute;inset:0;background:rgba(25,12,4,.55);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;background:var(--parch);
  background-image:linear-gradient(rgba(255,250,232,.55),rgba(255,250,232,.2));border-radius:18px 18px 0 0;border-top:3px double #b9913f;
  transform:translateY(100%);transition:transform .2s ease-out;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 16px;border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;font-family:'Unifraktur',serif;font-weight:normal;font-size:1.55rem;color:var(--seal);line-height:1.1}
.sh-head .x{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#f6ebcc;font-size:1.2rem}
.sh-body{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-foot{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:rgba(236,220,180,.95)}
.sh-foot .btn{flex:1}
.sheet-wrap.dialog{align-items:center;padding:16px}
.sheet-wrap.dialog .sheet{border-radius:16px;max-height:80vh;border:3px double #b9913f;transform:scale(.94);opacity:0;transition:transform .15s,opacity .15s}
.sheet-wrap.dialog.open .sheet{transform:none;opacity:1}
.sheet-wrap.dialog .sh-foot{border-radius:0 0 14px 14px}
.pick{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-height:52px}
.pick:active{background:var(--card2)}
.pick .muted{font-size:.88rem}

/* home */
.hero{text-align:center;padding:6px 4px 2px}
.hero .sub{font-size:1.05rem;color:var(--ink2);margin-top:4px}
.flourish{display:block;margin:6px auto 0;width:180px;height:14px}
.ex-card .name{font-family:'Unifraktur',serif;font-size:1.45rem;line-height:1.1;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.stats div{background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.stats b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted);font-family:'FellSC',serif}
.shards{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.shard{aspect-ratio:1/1.35;border:0;background:none;padding:0;position:relative}
.shard svg{width:100%;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;margin-top:8px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.banner-lost{background:linear-gradient(#2c211a,#160f0a);color:#f3e1b4;border:2px solid #8e1b1b;border-radius:12px;padding:14px;margin:12px 0;text-align:center}
.banner-lost .bl{font-size:1.6rem;color:#e0473a}
.turn-card{background:linear-gradient(135deg,var(--acc) 0 10px,var(--card) 10px)}
.flavour{font-style:italic;color:var(--ink2)}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-family:'FellSC',serif;color:var(--ink2);font-size:1.05rem}

/* chronicle */
.chron .entry{padding:10px 0;border-bottom:1px dashed var(--line)}
.chron .entry:last-child{border-bottom:0}
.chron .when{font-family:'FellSC',serif;font-size:.85rem;color:var(--muted)}
.chron .dropcap::first-letter{font-family:'Unifraktur',serif;font-size:1.7em;color:var(--seal);float:left;line-height:.9;margin:2px 4px 0 0}
.turn-h{font-family:'Unifraktur',serif;font-size:1.3rem;color:var(--seal);margin-top:14px;border-bottom:1px solid var(--line)}

/* ledger */
.ledger .l{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.ledger .amt{font-weight:700;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}

#toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
  background:#2a1b0e;color:#f8e8c0;padding:12px 18px;border-radius:12px;border:1px solid #b9913f;max-width:92vw;transition:all .2s;pointer-events:none;font-size:.95rem;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-style:italic}
.note-box{background:#fbf2d9;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}

/* ---------- phase 2: maps ---------- */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.dng{display:inline-flex;gap:3px;vertical-align:middle}
.dng i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--seal);background:transparent;display:inline-block}
.dng i.on{background:var(--seal)}
.mapframe{position:relative;height:min(58vh,560px);margin:10px 0 0;border-radius:12px;overflow:hidden;border:3px double #b9913f;box-shadow:0 2px 8px rgba(60,30,5,.35)}
.mapframe .mv{position:absolute;inset:0}
.mapscreen{position:fixed;left:0;right:0;top:var(--toph,58px);bottom:calc(var(--navh) + var(--safe-b));display:flex;flex-direction:column;z-index:5;background:var(--parch)}
.ms-head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid var(--line);background:linear-gradient(#f4e7c6,#ead8ac)}
.ms-head h2{font-family:'Unifraktur',serif;font-weight:normal;font-size:1.4rem;line-height:1.1;color:var(--seal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-body{position:relative;flex:1;min-height:0}
.ms-body .mv{position:absolute;inset:0}
.mv{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  background:#4a3420 radial-gradient(ellipse at 50% 40%,#6b4d2c,#2e1f10 75%)}
.mv.dragging{cursor:grabbing}
.mv.loading::after{content:'Unrolling the map…';position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#f3e1b4;font-style:italic;background:rgba(30,18,8,.7);padding:8px 14px;border-radius:10px}
.mv-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.mv-img{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none}
.mv-blank{background-color:#ecdcb4;background-image:linear-gradient(rgba(122,96,64,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(122,96,64,.18) 1px,transparent 1px);box-shadow:inset 0 0 120px rgba(110,70,25,.45)}
.mv-msg{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);text-align:center;color:var(--ink2);font-style:italic;pointer-events:none;text-shadow:0 1px 0 #fff6dc;font-size:1rem}
.mv-trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mv-trail polyline{fill:none;stroke-dasharray:.01 11;stroke-linecap:round;stroke-linejoin:round}
.mv-trail .tr-under{stroke:#1b1108;stroke-width:8;opacity:.85}
.mv-trail .tr{stroke-width:4.5}
.mv-ov{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #fbefd0;box-shadow:0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(40,20,5,.6);display:flex;align-items:center;justify-content:center;color:#fff8e0}
.pin svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin.static{position:relative;margin:0;flex:none}
.pin.static.sm{width:26px;height:26px}
.pseal{position:absolute;right:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c63a30,#6e1210);color:#ffe9b8;font-size:11px;line-height:18px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.plabel{position:absolute;left:0;top:16px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(251,243,220,.92);color:var(--ink);border:1px solid var(--line);display:none;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.mv-labels .plabel,.mk.lift .plabel,.mk.moving .plabel{display:block}
.mk.lift .pin{transform:scale(1.35);box-shadow:0 6px 12px rgba(0,0,0,.55),0 0 0 3px #d6ad2b}
.mk.moving .pin{box-shadow:0 0 0 4px #d6ad2b,0 1px 3px rgba(0,0,0,.6);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.2)}}
.mk.ghost .pin{opacity:.85;box-shadow:0 0 0 4px rgba(214,173,43,.9)}
.setup .mk-pin .pin{border-color:#ffd75a}
.mk-token{z-index:2}
.token{position:absolute;left:calc(var(--off,0px) - 14px);top:-50px;width:28px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.token .shield{width:28px;height:34px}
.token.sm{left:calc(var(--off,0px) + 6px);top:-36px;width:20px;height:25px}
.token.sm .shield{width:20px;height:25px}
.token.sm::after{display:none}
.token::after{content:'';position:absolute;left:12px;top:33px;width:4px;height:6px;background:#2a1b0e}
.hot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fbefd0;
  background:radial-gradient(circle at 35% 30%,#d24a3c,#7b1714);box-shadow:0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(40,20,5,.6)}
.hot::after{content:'';position:absolute;inset:5px;border-radius:50%;border:1.5px solid rgba(255,233,184,.7)}
.mk-hot.far .hot{background:radial-gradient(circle at 35% 30%,#8c6ab0,#3d2558)}
.mk-hot .plabel{top:14px}
.mv-tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:3}
.mv-tools>*{pointer-events:auto}
.mv-tools>div:empty{pointer-events:none}
.zoomstack{display:flex;flex-direction:column;gap:8px}
.zb{background:rgba(247,237,210,.95);box-shadow:0 2px 5px rgba(0,0,0,.4);font-size:1.6rem;line-height:1}
.setupbtn{box-shadow:0 2px 6px rgba(0,0,0,.45);min-width:120px}
.ms-banner{position:absolute;left:10px;right:10px;top:10px;z-index:3;background:rgba(42,27,14,.92);color:#f8e8c0;border:1px solid #b9913f;border-radius:12px;padding:10px 12px;font-size:.95rem;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ms-banner .btn{flex:none}
.region-card .thumb{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#e8d5a8;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-style:italic}
.region-card .thumb img{width:100%;height:100%;object-fit:cover}
.thumbbig{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.rumour{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ink2)}
.rumour .mini{width:14px;height:19px;display:inline-block;flex:none}
.rumour .mini svg{width:100%;height:100%}
.pick.rec{border-color:var(--seal);box-shadow:0 0 0 2px rgba(142,27,27,.25)}
.warnbox{border-color:var(--warn);background:#fbecd0;margin:8px 0}
.ex-loc{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:.92rem;color:var(--ink2)}
.ex-loc .ic{width:18px;height:18px;color:var(--seal)}
body.mapmode{overflow:hidden}
.shards{grid-template-columns:repeat(7,minmax(0,1fr))}
.shard svg{display:block}
/* steppers: keep 48px buttons but leave room for three digits in half-width columns */
.stepper{gap:4px}
.stepper button{width:48px;flex:none}
.form .stepper input{padding:6px 2px;min-width:3.2ch;font-variant-numeric:tabular-nums}
@media (max-width:370px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Runefang</div>
  <div class="turn" id="turnchip"></div>
  <div id="savedot" title="Saved"></div>
</header>
<main id="view"><p class="empty">Unrolling the parchment…</p></main>
<nav id="tabs"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" hidden>

<script>
'use strict';
/* =====================================================================
   RUNEFANG — Old World campaign companion
   Phase 1: data model, storage, export/import, rosters, gold
   ===================================================================== */
const APP_VERSION = '2.1 · phase 2';
const SCHEMA = 2;
const FORMAT = 'runefang-campaign';

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function seedRegion(row) {
  const [id, name, short, aspect, danger, far, home, hot, factions, blurb, pins] = row;
  return { id, name, short, aspect, danger, far, home, hot: { x: hot[0] / 100, y: hot[1] / 100 }, factions: { ...factions }, blurb, notes: '',
    map: null, pins: pins.map(([n, t, f, x, y]) => ({ id: pinId(id, n), name: n, terrain: t, faction: f, x: x / 100, y: y / 100, notes: '', seeded: true })) };
}
/* Idempotent: adds anything phase 2 needs to a campaign, never removes rosters or user edits. */
function seedPhase2(c) {
  c.regions = Array.isArray(c.regions) ? c.regions : [];
  if (!c.regions.length) c.regions = REGION_SEED.map(seedRegion);
  for (const r of c.regions) {
    r.pins = r.pins || []; r.factions = r.factions || {}; r.hot = r.hot || { x: .5, y: .5 };
    if (r.danger == null) r.danger = 2; if (!r.aspect) r.aspect = 1.414; if (r.map === undefined) r.map = null;
  }
  c.overview = c.overview || { map: null, aspect: OVERVIEW_ASPECT };
  c.missions = c.missions || [];
  (c.shards || []).forEach((s, i) => {
    if (!s.regionId && SHARD_SITES[i] && c.regions.some(r => r.id === SHARD_SITES[i][0])) {
      s.regionId = SHARD_SITES[i][0]; s.pinId = pinId(...SHARD_SITES[i]);
    }
    if (s.pinId === undefined) s.pinId = null;
  });
  for (const s of SIDES) {
    const e = c.ex[s];
    e.trail = e.trail || [];
    if (!e.pos) {
      const [rid, pn] = START_POS[s]; const r = c.regions.find(x => x.id === rid); const p = r && r.pins.find(x => x.id === pinId(rid, pn));
      e.pos = r ? { regionId: rid, pinId: p ? p.id : null } : null;
      if (e.pos) e.trail.push({ regionId: rid, pinId: e.pos.pinId, x: p ? p.x : null, y: p ? p.y : null, turn: c.turn || 1, ts: Date.now() });
    }
  }
  c.schema = Math.max(c.schema || 1, 2);
  return c;
}

/* ---------- the daemon's secret (obfuscated so the export file can't be read at a glance) ---------- */
function sealSecret(obj, key) {
  const s = JSON.stringify(obj); let out = '';
  for (let i = 0; i < s.length; i++) out += String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return btoa(unescape(encodeURIComponent(out)));
}
function unsealSecret(str, key) {
  try { const s = decodeURIComponent(escape(atob(str))); let out = '';
    for (let i = 0; i < s.length; i++) out += String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return JSON.parse(out); } catch (e) { return null; }
}
const sealKey = c => 'alaric~' + c.id + '~mad';

function newCampaign(opts = {}) {
  const S = clone(DEFAULT_SETTINGS);
  const c = {
    format: FORMAT, schema: SCHEMA, id: uid('cmp'),

    created: Date.now(), updated: Date.now(), lastExport: null,
    turn: 1, active: 'sig', stage: 1,
    settings: S,
    perkLibrary: [...DEFAULT_PERKS],
    unitCatalog: clone(DEFAULT_CATALOG),
    ex: seedExpeditions(S.startingGold),
    shards: SHARD_NAMES.map((n, i) => ({ id: 'shard' + (i + 1), name: n, status: 'rumoured', regionId: null, notes: '' })),
    regions: [],      // phase 2
    missions: [],     // phase 3
    tables: { injuries: clone(DEFAULT_INJURIES) },   // more tables in phase 4
    flags: {},
    threat: { rival: 0, cult: 0 },
    chronicle: [],
    seal: '',
  };
  // The daemon plants one vision. Decided once, here, and sealed.
  const traitor = Math.random() < 0.5 ? 'sig' : 'ulr';
  c.seal = sealSecret({ t: traitor, n: Math.random().toString(36).slice(2), at: Date.now() }, sealKey(c));
  if (opts.p1) c.ex.sig.player = opts.p1;
  if (opts.p2) c.ex.ulr.player = opts.p2;
  c.chronicle.push({ id: uid('ch'), ts: Date.now(), turn: 1, side: null, kind: 'story',
    text: 'The Reikland Runefang lies shattered, and Karl Franz bleeds from a daemon’s wound. Two expeditions set out to recover the scattered shards: the Sigmarite Expedition marching from Stirland, and the Ulrican Expedition from Middenland under the White Wolf’s banner. Each priest swears his vision shows the way.' });
  seedPhase2(c);
  return c;
}

/* fill any missing keys from a template (for older saves / imports) */
function fillDefaults(target, tpl) {
  for (const k in tpl) {
    if (target[k] === undefined || target[k] === null && tpl[k] !== null) target[k] = clone(tpl[k]);
    else if (tpl[k] && typeof tpl[k] === 'object' && !Array.isArray(tpl[k]) && typeof target[k] === 'object') fillDefaults(target[k], tpl[k]);
  }
  return target;
}
function migrate(c) {
  c.schema = c.schema || 1;
  fillDefaults(c.settings = c.settings || {}, DEFAULT_SETTINGS);
  c.perkLibrary = c.perkLibrary || [...DEFAULT_PERKS];
  c.unitCatalog = c.unitCatalog || clone(DEFAULT_CATALOG);
  c.tables = c.tables || {}; c.tables.injuries = c.tables.injuries || clone(DEFAULT_INJURIES);
  for (const k of ['regions', 'missions', 'chronicle', 'shards']) c[k] = c[k] || [];
  c.flags = c.flags || {}; c.threat = c.threat || { rival: 0, cult: 0 };
  for (const s of SIDES) {
    const e = c.ex[s];
    for (const k of ['ledger', 'characters', 'regiments', 'relics']) e[k] = e[k] || [];
    e.status = e.status || 'active';
    e.regiments.forEach(r => { r.perks = r.perks || []; r.upgrades = r.upgrades || []; r.rank = r.rank || 0; r.xp = r.xp || 0; });
    e.characters.forEach(h => { h.injuries = h.injuries || []; h.xp = h.xp || 0; h.status = h.status || 'fit'; });
  }
  seedPhase2(c);   // schema 1 → 2: regions, pins, shard sites, expedition positions
  return c;
}

/* =====================================================================
   STORAGE — IndexedDB with localStorage fallback
   stores: kv (campaign), images (Blobs, phase 2), backups
   ===================================================================== */
const DB = {
  db: null, ok: false, fallback: false,
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('No IndexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('runefang-companion', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const s of ['kv', 'images', 'backups']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('Database blocked'));
      });
      this.ok = true;
    } catch (e) { console.warn('IndexedDB unavailable', e); this.ok = false; this.fallback = true; }
    return this.ok;
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req ? req.result : undefined);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction aborted'));
      } catch (e) { rej(e); }
    });
  },
  async get(store, key) {
    if (this.ok) return this._tx(store, 'readonly', s => s.get(key));
    try { const v = localStorage.getItem('rf_' + store + '_' + key); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; }
  },
  async put(store, key, val) {
    if (this.ok) return this._tx(store, 'readwrite', s => s.put(val, key));
    localStorage.setItem('rf_' + store + '_' + key, JSON.stringify(val));
  },
  async del(store, key) { if (this.ok) return this._tx(store, 'readwrite', s => s.delete(key)); try { localStorage.removeItem('rf_' + store + '_' + key); } catch (e) {} },
  async keys(store) { if (this.ok) return this._tx(store, 'readonly', s => s.getAllKeys()); return []; },
  async clear(store) { if (this.ok) return this._tx(store, 'readwrite', s => s.clear()); },
};

const Sheets = { stack: [], delta: 0, timer: null, skip: 0 };
function histOp(d) {
  Sheets.delta += d;
  if (Sheets.timer) return;
  Sheets.timer = setTimeout(() => {
    const n = Sheets.delta; Sheets.delta = 0; Sheets.timer = null;
    try {
      if (n > 0) for (let i = 0; i < n; i++) history.pushState({ sheet: true }, '');
      else if (n < 0) { Sheets.skip++; history.go(n); }
    } catch (e) {}
  }, 0);
}
window.addEventListener('popstate', () => {
  if (Sheets.skip > 0) { Sheets.skip--; return; }
  const top = Sheets.stack[Sheets.stack.length - 1];
  if (top) return removeSheet(top, undefined);
  if (UI.view === 'region' && UI.regionPushed) { UI.regionPushed = false; go('map'); }
});
function openSheet({ title, html, footer, cls, onMount, onClose }) {
  const el = document.createElement('div');
  el.className = 'sheet-wrap ' + (cls || '');
  el.innerHTML = `<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-head"><h2>${esc(title)}</h2><button class="x" aria-label="Close">✕</button></div>
    <div class="sh-body">${html || ''}</div>${footer ? `<div class="sh-foot">${footer}</div>` : ''}</div>`;
  $('#sheet-root').appendChild(el);
  const sh = { el, onClose, body: $('.sh-body', el), foot: $('.sh-foot', el) };
  sh.close = v => closeSheet(sh, v);
  const opened = performance.now();
  $('.backdrop', el).onclick = () => { if (performance.now() - opened > 400) sh.close(); };
  $('.x', el).onclick = () => sh.close();
  Sheets.stack.push(sh); histOp(1);
  document.body.classList.add('noscroll');
  bindSteppers(sh.body); bindSegs(sh.body);
  if (onMount) onMount(sh);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
  return sh;
}
function closeSheet(sh, val) { if (!Sheets.stack.includes(sh)) return; histOp(-1); removeSheet(sh, val); }
function removeSheet(sh, val) {
  Sheets.stack = Sheets.stack.filter(x => x !== sh);
  sh.el.classList.remove('open');
  setTimeout(() => sh.el.remove(), 220);
  if (!Sheets.stack.length) document.body.classList.remove('noscroll');

}
function confirmBox({ title = 'Are you sure?', text = '', ok = 'Confirm', cancel = 'Cancel', danger = false }) {

}

/* ---------- form fields ---------- */
function fieldHtml(f) {
  const id = 'f_' + f.key.replace(/\W/g, '_');
  const lab = f.label ? `<label class="l" for="${id}">${esc(f.label)}</label>` : '';
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
  const v = f.value ?? '';
  let inner = '';
  switch (f.type) {
    case 'textarea': inner = `<textarea id="${id}" name="${f.key}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`; break;
    case 'number': inner = `<input id="${id}" name="${f.key}" data-num="1" type="number" inputmode="decimal" step="${f.step ?? 'any'}" value="${esc(v)}">`; break;
    case 'stepper': inner = stepperHtml(f.key, v, f.min, f.max, f.step, id); break;
    case 'select': inner = `<select id="${id}" name="${f.key}">${f.options.map(o => { const [val, lbl] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lbl)}</option>`; }).join('')}</select>`; break;
    case 'seg': inner = segHtml(f.key, v, f.options); break;
    case 'toggle': return `<div class="f"><label class="toggle"><input type="checkbox" name="${f.key}" ${v ? 'checked' : ''}> <span>${esc(f.label)}</span></label>${hint}</div>`;
    case 'html': return `<div class="f">${f.html}</div>`;
    default: inner = `<input id="${id}" name="${f.key}" type="text" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" ${f.list ? `list="${f.list}"` : ''} autocomplete="off">`;
  }
  return `<div class="f">${lab}${inner}${hint}</div>`;
}
function stepperHtml(key, v, min = 0, max = 9999, step = 1, id = '') {
  return `<div class="stepper" data-min="${min}" data-max="${max}" data-step="${step}">
    <button type="button" data-d="-1" aria-label="Decrease">−</button>
    <input ${id ? `id="${id}"` : ''} name="${key}" data-num="1" inputmode="numeric" value="${esc(v)}">
    <button type="button" data-d="1" aria-label="Increase">+</button></div>`;
}
function segHtml(key, v, options) {
  return `<div class="seg" data-seg="${key}">${options.map(o => { const [val, lbl] = Array.isArray(o) ? o : [o, o];
    return `<button type="button" data-v="${esc(val)}" class="${String(val) === String(v) ? 'on' : ''}">${esc(lbl)}</button>`; }).join('')}</div>
    <input type="hidden" name="${key}" value="${esc(v)}">`;
}
function bindSteppers(root) {
  root.addEventListener('click', e => {
    const b = e.target.closest('.stepper button[data-d]'); if (!b) return;
    const st = b.closest('.stepper'); const inp = $('input', st);
    const step = num(st.dataset.step, 1);
    inp.value = clamp(num(inp.value) + step * num(b.dataset.d), num(st.dataset.min, -1e9), num(st.dataset.max, 1e9));
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
function bindSegs(root) {
  root.addEventListener('click', e => {
    const b = e.target.closest('.seg[data-seg] button'); if (!b) return;
    const seg = b.closest('.seg'); $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    const hid = seg.nextElementSibling; if (hid && hid.name === seg.dataset.seg) { hid.value = b.dataset.v; hid.dispatchEvent(new Event('input', { bubbles: true })); }
  });
}
function readInputs(root, into = {}) {
  $$('[name]', root).forEach(el => {
    if (el.type === 'checkbox') into[el.name] = el.checked;
    else if (el.dataset.num) into[el.name] = num(el.value);
    else into[el.name] = el.value;
  });
  return into;
}
function formSheet({ title, fields, ok = 'Save', intro = '' }) {
  return new Promise(res => {
    openSheet({ title, html: `${intro}<form class="form" onsubmit="return false">${fields.map(fieldHtml).join('')}</form>`,
      footer: `<button class="btn ghost" data-r="0">Cancel</button><button class="btn seal" data-r="1">${esc(ok)}</button>`,
      onMount: sh => sh.foot.addEventListener('click', e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        sh.close(b.dataset.r === '1' ? readInputs(sh.body) : null);
      }),
      onClose: v => res(v || null) });
  });
}

/* ---------- CHRONICLE ---------- */
function viewChron() {
  const list = [...C.chronicle].reverse();
  let h = `<div class="row between" style="margin-top:4px"><h1 class="bl">Chronicle</h1><button class="btn sm" data-act="chronAdd">+ Entry</button></div>
    <button class="linkbtn" data-act="goCodex">← Back to the Codex</button>
    <p class="small muted">Every hire, rank and twist of fate is written here. The full story-style chronicle arrives in phase 4.</p>
    <div class="btns"><button class="btn" data-act="chronTxt">Export as text</button></div><div class="card chron">`;
  let lastTurn = null;
  for (const c of list) {
    if (c.turn !== lastTurn) { h += `<div class="turn-h">Turn ${c.turn}</div>`; lastTurn = c.turn; }
    h += `<div class="entry"><div class="when">${new Date(c.ts).toLocaleDateString()}${c.side ? ' · ' + esc(exShort(c.side)) : ''}</div><div class="${c.kind === 'story' ? 'dropcap flavour' : ''}">${esc(c.text)}</div></div>`;
  }
  return h + (list.length ? '' : '<div class="empty">Nothing yet written.</div>') + '</div>';
}

async function fillCodexAsync() {
  if (UI.view !== 'more') return;
  let info = [];
  info.push(DB.ok ? 'Saving to this phone’s app storage (IndexedDB).' : '<b style="color:var(--bad)">IndexedDB unavailable. Using limited fallback storage. Export often!</b>');
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      info.push(`Using ${(est.usage / 1048576).toFixed(1)} MB of about ${(est.quota / 1048576).toFixed(0)} MB available.`);
    }
    if (navigator.storage && navigator.storage.persisted) info.push(await navigator.storage.persisted() ? 'Storage is marked <b>persistent</b> (the browser won’t clear it).' : 'Storage is not yet persistent. Installing the app to your home screen usually fixes this.');
  } catch (e) {}
  const el = $('#storageInfo'); if (el) el.innerHTML = info.map(x => `<p>${x}</p>`).join('');
  try {
    const b = await DB.get('backups', 'last');
    const slot = $('#undoImportSlot');
    if (b && slot) slot.innerHTML = `<button class="linkbtn" data-act="undoImport">Restore the campaign replaced on ${new Date(b.at).toLocaleString()}</button>`;
  } catch (e) {}
}

/* =====================================================================

   ===================================================================== */
function findReg(id) { for (const s of SIDES) { const r = EX(s).regiments.find(x => x.id === id); if (r) return [r, s]; } return [null, null]; }
function findChar(id) { for (const s of SIDES) { const r = EX(s).characters.find(x => x.id === id); if (r) return [r, s]; } return [null, null]; }

function unitTypeField(d) {
  const cat = C.unitCatalog, inCat = cat.some(u => u.name === d.unitType);
  return `<div class="f"><label class="l" for="f_unitSel">Unit type</label>
    <select id="f_unitSel" data-unitsel>${cat.map(u => `<option value="${esc(u.name)}" ${u.name === d.unitType ? 'selected' : ''}>${esc(u.name)} · ${u.ppm} pts</option>`).join('')}
      <option value="__custom" ${inCat ? '' : 'selected'}>Other (type your own)…</option></select>
    ${inCat ? `<input type="hidden" name="unitType" value="${esc(d.unitType)}">` : `<input name="unitType" value="${esc(d.unitType)}" placeholder="e.g. Free Company Militia" autocomplete="off" style="margin-top:8px">`}
    <div class="hint">Picking a unit from the muster roll sets its points per model. Edit the list in Codex → Muster roll.</div></div>`;
}
function catalogDatalist() { return `<datalist id="dl_units">${C.unitCatalog.map(u => `<option value="${esc(u.name)}">`).join('')}</datalist>`; }

function editRegiment(id, isNew = false) {
  let [orig, side] = findReg(id);
  if (!orig) return;
  const d = clone(orig);
  openSheet({ title: isNew ? 'New regiment' : 'Regiment',
    onClose: v => { if (v !== 'saved' && isNew) { EX(side).regiments = EX(side).regiments.filter(x => x.id !== id); render(); } },
    footer: `${isNew ? '' : '<button class="btn danger" data-r="del">Disband</button>'}<button class="btn ghost" data-r="0">Cancel</button><button class="btn seal" data-r="1">Save</button>`,
    onMount: sh => {
      draw();
      sh.body.addEventListener('input', () => { readInputs($('.form', sh.body), d); updPts(); });
      sh.body.addEventListener('change', e => {
        if (!e.target.matches('[data-unitsel]')) return;
        readInputs($('.form', sh.body), d);
        const val = e.target.value;
        if (val === '__custom') { d.unitType = ''; draw(); const ci = $('[name=unitType]', sh.body); if (ci) ci.focus(); return; }
        const u = C.unitCatalog.find(x => x.name === val); d.unitType = val;
        if (u) { d.ppm = u.ppm; toast(`${u.name}: ${u.ppm} pts per model`, 1600); }
        draw();
      });
      sh.body.addEventListener('click', e => {
        const b = e.target.closest('[data-x]'); if (!b) return;
        readInputs($('.form', sh.body), d);
        const k = b.dataset.x, i = +b.dataset.i;
        if (k === 'rmPerk') d.perks.splice(i, 1);
        if (k === 'rmUp') d.upgrades.splice(i, 1);
        if (k === 'addUp') { const n = $('[data-up-name]', sh.body).value.trim(); const p = num($('[data-up-pts]', sh.body).value); if (!n) return toast('Name the upgrade first'); d.upgrades.push({ name: n, pts: p }); }
        if (k === 'addPerk') { pickPerk(d.perks).then(p => { if (p) { d.perks.push(p); draw(); } }); return; }
        if (k === 'fromCat') { const u = C.unitCatalog.find(x => x.name === d.unitType); if (u) { d.ppm = u.ppm; toast(`Points set to ${u.ppm} per model`); } else toast('No matching unit in the muster roll'); }
        draw();
      });
      sh.foot.addEventListener('click', async e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        readInputs($('.form', sh.body), d);
        if (b.dataset.r === 'del') {
          if (await confirmBox({ title: 'Disband regiment?', text: `<p><b>${esc(d.name)}</b> will be removed from the roster for good. To show it was wiped out in battle, set its models to 0 instead.</p>`, ok: 'Disband', danger: true })) {
            EX(side).regiments = EX(side).regiments.filter(x => x.id !== id); chron(side, 'roster', `${d.name} disbanded.`); save(); sh.close('saved'); render();
          }
          return;
        }
        if (b.dataset.r === '1') {
          d.name = d.name.trim() || 'Unnamed regiment';
          d.maxModels = Math.max(1, Math.round(d.maxModels)); d.models = clamp(Math.round(d.models), 0, d.maxModels);
          d.rank = clamp(Math.round(d.rank), 0, 3); d.xp = Math.max(0, Math.round(d.xp));
          if (isNew) chron(side, 'roster', `${d.name} (${d.models} ${d.unitType}) joined the ${exName(side)}.`);
          Object.assign(orig, d); save(); render(); return sh.close('saved');
        }
        sh.close();
      });
      function draw() {
        sh.body.innerHTML = `<form class="form" onsubmit="return false">${catalogDatalist()}
          ${fieldHtml({ key: 'name', label: 'Name', value: d.name })}
          ${unitTypeField(d)}
          <div class="two">${fieldHtml({ key: 'models', label: 'Models now', type: 'stepper', value: d.models, min: 0, max: 999 })}${fieldHtml({ key: 'maxModels', label: 'Full strength', type: 'stepper', value: d.maxModels, min: 1, max: 999 })}</div>
          <div class="two">${fieldHtml({ key: 'ppm', label: 'Points per model', type: 'number', value: d.ppm })}<div class="f"><label class="l">Unit total</label><div class="big" id="ptsOut" style="padding-top:8px"></div></div></div>
          <div class="two">${fieldHtml({ key: 'xp', label: 'Experience', type: 'stepper', value: d.xp, min: 0, max: 999 })}${fieldHtml({ key: 'rank', label: 'Veterancy rank', type: 'stepper', value: d.rank, min: 0, max: 3 })}</div>
          <div class="hint" id="rankHint" style="margin-top:-8px"></div>
          <div class="f"><label class="l">Perks</label>${d.perks.map((p, i) => `<span class="chip">★ ${esc(p)}<button type="button" class="x" data-x="rmPerk" data-i="${i}" aria-label="Remove">✕</button></span>`).join('') || '<span class="muted small">None yet</span>'}
            <div><button type="button" class="btn sm" data-x="addPerk" style="margin-top:6px">+ Add perk</button></div></div>
          <div class="f"><label class="l">Upgrades & equipment</label>${d.upgrades.map((u, i) => `<span class="chip">${esc(u.name)} · ${u.pts} pts<button type="button" class="x" data-x="rmUp" data-i="${i}" aria-label="Remove">✕</button></span>`).join('') || '<span class="muted small">None</span>'}
            <div class="row" style="margin-top:6px"><input data-up-name placeholder="e.g. Full command" style="flex:2;min-width:0;min-height:48px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fffaea">
            <input data-up-pts inputmode="numeric" placeholder="pts" style="flex:1;min-width:0;min-height:48px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fffaea">
            <button type="button" class="btn sm" data-x="addUp">Add</button></div></div>
          ${fieldHtml({ key: 'notes', label: 'Notes', type: 'textarea', value: d.notes })}</form>`;
        updPts();
      }
      function updPts() {
        const o = $('#ptsOut', sh.body); if (o) o.textContent = unitPts(d) + ' pts';
        const rh = $('#rankHint', sh.body);
        if (rh) { const t = S().xpThresholds; rh.textContent = `${rankName(clamp(d.rank, 0, 3))}. XP needed for ranks 1, 2 and 3: ${t[1]}, ${t[2]} and ${t[3]}.`; }
      }
    } });
}
function pickPerk(owned = []) {
  return new Promise(res => {
    const avail = C.perkLibrary.filter(p => !owned.includes(p));
    openSheet({ title: 'Choose a perk', html: `${avail.map((p, i) => `<button class="pick" data-p="${i}">★ ${esc(p)}</button>`).join('')}
      <div class="form"><div class="f"><label class="l">Or write your own</label><div class="row"><input id="customPerk" placeholder="Custom perk" style="flex:1"><button class="btn sm" id="okPerk">Add</button></div></div></div>`,
      onMount: sh => sh.body.addEventListener('click', e => {
        const b = e.target.closest('[data-p]'); if (b) return sh.close(avail[+b.dataset.p]);
        if (e.target.id === 'okPerk') { const v = $('#customPerk', sh.body).value.trim(); if (v) sh.close(v); }
      }), onClose: v => res(v || null) });
  });
}
async function rankUp(id) {
  const [r, s] = findReg(id); if (!r || !canRankUp(r)) return;
  const perk = await pickPerk(r.perks);
  if (!perk) return;
  r.rank += 1; r.perks.push(perk);
  chron(s, 'rank', `${r.name} have become ${rankName(r.rank)} and gained: ${perk}.`);
  save(); render(); toast(`${r.name}: ${rankName(r.rank)}!`);
}

function editCharacter(id, isNew = false) {
  const [orig, side] = findChar(id); if (!orig) return;
  const d = clone(orig);
  const e = EX(side);
  openSheet({ title: isNew ? 'New hero' : 'Hero',
    onClose: v => { if (v !== 'saved') { e.relics.forEach(r => delete r._pending); if (isNew) { e.characters = e.characters.filter(x => x.id !== id); render(); } } },
    footer: `${isNew ? '' : '<button class="btn danger" data-r="del">Remove</button>'}<button class="btn ghost" data-r="0">Cancel</button><button class="btn seal" data-r="1">Save</button>`,
    onMount: sh => {
      draw();
      sh.body.addEventListener('click', e2 => {
        const b = e2.target.closest('[data-x]'); if (!b) return;
        readInputs($('.form', sh.body), d);
        const k = b.dataset.x;
        if (k === 'rmInj') d.injuries.splice(+b.dataset.i, 1);
        if (k === 'addInj') { const v = $('[data-inj]', sh.body).value.trim(); if (v) d.injuries.push(v); }
        if (k === 'quickInj') { d.injuries.push(b.dataset.v); }
        if (k === 'unassign') { const rl = e.relics.find(x => x.id === b.dataset.id); if (rl) rl._pending = null; }
        if (k === 'assign') { const rl = e.relics.find(x => x.id === b.dataset.id); if (rl) rl._pending = id; }
        draw();
      });
      sh.foot.addEventListener('click', async e2 => {
        const b = e2.target.closest('[data-r]'); if (!b) return;
        readInputs($('.form', sh.body), d);
        if (b.dataset.r === 'del') {
          if (await confirmBox({ title: 'Remove hero?', text: `<p>Remove <b>${esc(d.name)}</b> from the roster? To record a death in battle, set their status to Dead instead.</p>`, ok: 'Remove', danger: true })) {
            e.characters = e.characters.filter(x => x.id !== id); e.relics.forEach(r => { if (r.assignedTo === id) r.assignedTo = null; delete r._pending; });
            save(); sh.close('saved'); render();
          }
          return;
        }
        if (b.dataset.r !== '1') return sh.close();
        // priest death check
        if (d.isPriest && d.status === 'dead' && orig.status !== 'dead') {
          const a = await confirmBox({ title: 'The Priest falls?', text: `<p>If <b>${esc(d.name)}</b> is slain, <b>${esc(e.name)}</b> loses the campaign.</p>`, ok: 'Yes, they are dead', danger: true });
          if (!a) return;
          const b2 = await confirmBox({ title: 'Truly?', text: '<p>This ends the campaign for this expedition. Confirm once more.</p>', ok: 'Confirm the death', danger: true });
          if (!b2) return;
          e.status = 'lost';
          chron(side, 'death', `${d.name} has fallen. Without its Priest, ${e.name} breaks apart, and the race for the Runefang is lost to them.`);
        } else if (d.status === 'dead' && orig.status !== 'dead') {
          chron(side, 'death', `${d.name} (${d.role}) has fallen.`);
        }
        if (d.isPriest) e.characters.forEach(x => { if (x.id !== id) x.isPriest = false; });
        e.relics.forEach(r => { if ('_pending' in r) { r.assignedTo = r._pending; delete r._pending; } });
        d.name = d.name.trim() || 'Unnamed hero'; d.xp = Math.max(0, Math.round(d.xp));
        Object.assign(orig, d); save(); render(); sh.close('saved');
      });
      function borne(r) { return '_pending' in r ? r._pending === id : r.assignedTo === id; }
      function draw() {
        const mine = e.relics.filter(borne), free = e.relics.filter(r => !borne(r) && !('_pending' in r ? r._pending : r.assignedTo));
        const inj = C.tables.injuries.filter(x => !/^(Dead|Multiple Injuries|Full Recovery)$/.test(x.name));
        sh.body.innerHTML = `<form class="form" onsubmit="return false">
          ${fieldHtml({ key: 'name', label: 'Name', value: d.name })}
          ${fieldHtml({ key: 'role', label: 'Role', value: d.role, placeholder: 'e.g. Captain of the Empire' })}
          ${fieldHtml({ key: 'isPriest', type: 'toggle', label: 'Expedition Priest (if slain, the campaign is lost)', value: d.isPriest })}
          <div class="f"><label class="l">Status</label>${segHtml('status', d.status, Object.entries(STATUS).map(([k, v]) => [k, k === 'out' ? 'Out' : v]))}</div>
          <div class="two">${fieldHtml({ key: 'points', label: 'Points', type: 'number', value: d.points })}${fieldHtml({ key: 'xp', label: 'Experience', type: 'stepper', value: d.xp, min: 0, max: 999 })}</div>
          <div class="f"><label class="l">Injuries</label>${d.injuries.map((x, i) => `<span class="chip">✚ ${esc(x)}<button type="button" class="x" data-x="rmInj" data-i="${i}">✕</button></span>`).join('') || '<span class="small muted">None</span>'}
            <div class="row" style="margin-top:6px"><input data-inj placeholder="Describe an injury" style="flex:1;min-width:0"><button type="button" class="btn sm" data-x="addInj">Add</button></div>
            <details style="margin-top:6px"><summary>Pick from the injury table</summary>${inj.map(x => `<button type="button" class="pick" data-x="quickInj" data-v="${esc(x.name)}"><b>${esc(x.name)}</b><div class="muted">${esc(x.effect)}</div></button>`).join('')}</details></div>
          <div class="f"><label class="l">Magic items & relics</label>${mine.map(r => `<span class="chip">◆ ${esc(r.name)}<button type="button" class="x" data-x="unassign" data-id="${r.id}">✕</button></span>`).join('') || '<span class="small muted">None carried</span>'}
            ${free.length ? `<div class="small muted" style="margin-top:6px">From the vault:</div>${free.map(r => `<button type="button" class="pick" data-x="assign" data-id="${r.id}">◆ Give <b>${esc(r.name)}</b><div class="muted">${esc(r.effect || '')}</div></button>`).join('')}` : '<div class="hint">Add relics in Camp → Relic Vault.</div>'}</div>
          ${fieldHtml({ key: 'notes', label: 'Notes', type: 'textarea', value: d.notes })}</form>`;
      }
    } });
}

async function hireSheet(side) {
  const e = EX(side);
  const cat = C.unitCatalog.filter(u => u.side === 'any' || u.side === side);
  openSheet({ title: 'Hire a regiment', html: `<p class="small muted">War chest: <b>${e.gold} gc</b>. Points shown are approximate. Edit them in Codex → Muster roll.</p>
    ${cat.map(u => { const c = Math.round(u.min * u.ppm * S().goldPerPoint); return `<button class="pick" data-u="${u.id}" ${e.gold < c ? 'style="opacity:.55"' : ''}><div class="row between"><b>${esc(u.name)}</b><span>${u.ppm} pts/model</span></div><div class="muted">${esc(u.type)} · ${u.min}–${u.max} models · from ${c} gc</div></button>`; }).join('')}`,
    onMount: sh => sh.body.addEventListener('click', ev => {
      const b = ev.target.closest('[data-u]'); if (!b) return;
      const u = C.unitCatalog.find(x => x.id === b.dataset.u);
      step2(sh, u);
    }) });
  function step2(sh, u) {
    const d = { name: `New ${u.name}`, models: u.max >= 10 && u.min < 10 ? 10 : u.min };
    const cost = () => Math.round(d.models * u.ppm * S().goldPerPoint);
    sh.body.innerHTML = `<form class="form" onsubmit="return false"><h3 class="sc" style="margin-top:12px">${esc(u.name)} · ${esc(u.type)}</h3>
      ${fieldHtml({ key: 'name', label: 'Regiment name', value: d.name })}
      ${fieldHtml({ key: 'models', label: `Models (${u.min}–${u.max})`, type: 'stepper', value: d.models, min: u.min, max: u.max })}
      <div class="card center"><div class="small muted">Cost</div><div class="huge" id="hc"></div><div class="small muted" id="hl"></div></div>
      <button type="button" class="btn block seal" id="doHire">Hire</button><button type="button" class="btn block ghost" id="back" style="margin-top:8px">← Back to the list</button></form>`;
    const upd = () => { readInputs(sh.body, d); d.models = clamp(Math.round(d.models), u.min, u.max); $('#hc', sh.body).textContent = cost() + ' gc'; $('#hl', sh.body).textContent = `You have ${e.gold} gc; ${e.gold - cost()} left after hiring`; $('#doHire', sh.body).disabled = e.gold < cost(); };
    sh.body.oninput = upd; upd();
    $('#back', sh.body).onclick = () => { sh.close(); hireSheet(side); };
    $('#doHire', sh.body).onclick = () => {
      upd(); if (e.gold < cost()) return toast('Not enough gold');

/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function dataURLToBlob(u) { const r = await fetch(u); return r.blob(); }
async function buildExport() {
  await flush();
  const images = {};
  try { for (const k of await DB.keys('images')) { const b = await DB.get('images', k); if (b) images[k] = b instanceof Blob ? await blobToDataURL(b) : b; } } catch (e) { console.warn(e); }
  return { format: FORMAT, schema: SCHEMA, app: APP_VERSION, exportedAt: new Date().toISOString(), campaign: C, images };
}
const exportName = (ext = 'json') => `runefang-turn${C.turn}-${today()}.${ext}`;
function download(text, name, type) {
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function doExport(share = false) {
  try {
    toast('Preparing the campaign file…');
    const data = await buildExport(); const text = JSON.stringify(data);
    if (share && navigator.share) {
      const cands = [[exportName('json'), 'application/json'], [exportName('json'), 'text/plain'], [exportName('txt'), 'text/plain']];
      for (const [n, t] of cands) {
        const f = new File([text], n, { type: t });
        if (navigator.canShare && navigator.canShare({ files: [f] })) {
          try { await navigator.share({ files: [f], title: C.name }); markExported(); return; }
          catch (e) { if (e.name === 'AbortError') return; }
        }
      }
      toast('This phone can’t share files directly, so the file was downloaded instead.');
    }
    download(text, exportName('json'), 'application/json'); markExported();
    toast(`Saved ${exportName('json')} (${(text.length / 1048576).toFixed(2)} MB) to Downloads`, 3500);
  } catch (e) { console.error(e); toast('Export failed: ' + e.message); }
}
function markExported() { C.lastExport = Date.now(); C.updated = C.lastExport; dirty = true; flush(); render(); }

async function snapshotForUndo() {
  try {
    const images = {};
    for (const k of await DB.keys('images')) images[k] = await DB.get('images', k);
    await DB.put('backups', 'last', { at: Date.now(), campaign: clone(C), images });
  } catch (e) { console.warn('Backup failed', e); }
}
async function replaceCampaign(camp, images) {
  await DB.clear('images');
  for (const [k, v] of Object.entries(images || {})) await DB.put('images', k, typeof v === 'string' && v.startsWith('data:') ? await dataURLToBlob(v) : v);
  clearImageCache(); UI.mapViews = {}; UI.view = UI.view === 'region' ? 'map' : UI.view;
  C = migrate(camp); dirty = true; await flush();
}
async function doImport(file) {
  try {
    const text = await file.text();
    let data; try { data = JSON.parse(text); } catch (e) { return alertBox('Not a campaign file', '<p>That file isn’t readable JSON. Choose a file exported from Runefang.</p>'); }
    if (!data || data.format !== FORMAT || !data.campaign || !data.campaign.ex) return alertBox('Not a campaign file', '<p>That file wasn’t exported from Runefang.</p>');
    const ic = data.campaign;
    const imgN = Object.keys(data.images || {}).length;
    const ok = await confirmBox({ title: 'Import campaign?', ok: 'Import', danger: true,
      text: `<p>Replace <b>${esc(C.name)}</b> (turn ${C.turn}) on this phone with:</p>
      <div class="note-box"><b>${esc(ic.name)}</b><br>Turn ${ic.turn} · ${esc((ic.ex.sig || {}).player || '')} vs ${esc((ic.ex.ulr || {}).player || '')}<br>Exported ${data.exportedAt ? new Date(data.exportedAt).toLocaleString() : '?'}${imgN ? `<br>${imgN} images` : ''}</div>
      <p class="small muted">The current campaign is kept as an undo copy in Codex.</p>` });
    if (!ok) return;
    await snapshotForUndo();
    await replaceCampaign(ic, data.images);
    UI.side = C.active; render(); toast('Campaign imported');
  } catch (e) { console.error(e); alertBox('Import failed', `<p>${esc(e.message || e)}</p>`); }
}
async function undoImport() {
  const b = await DB.get('backups', 'last'); if (!b) return toast('No undo copy');
  if (!await confirmBox({ title: 'Restore previous campaign?', text: `<p>Bring back <b>${esc(b.campaign.name)}</b> (turn ${b.campaign.turn}), replaced on ${new Date(b.at).toLocaleString()}. The campaign you have now becomes the new undo copy.</p>`, ok: 'Restore', danger: true })) return;
  const cur = { at: Date.now(), campaign: clone(C), images: {} };
  try { for (const k of await DB.keys('images')) cur.images[k] = await DB.get('images', k); } catch (e) {}
  await replaceCampaign(b.campaign, b.images);
  await DB.put('backups', 'last', cur);
  render(); toast('Restored');
}
async function newCampaignFlow() {
  if (!await confirmBox({ title: 'Begin anew?', text: '<p>Start a fresh campaign with the default rosters? Export first if you want to keep the current one. An undo copy is kept on this phone too.</p>', ok: 'Continue', danger: true })) return;

  await snapshotForUndo();

  UI.side = 'sig'; go('home'); toast('A new campaign begins');
}
function chronicleText() {
  let out = `${C.name}\nA campaign chronicle — exported ${new Date().toLocaleString()}\n${'='.repeat(40)}\n`;
  let t = null;
  for (const c of C.chronicle) {
    if (c.turn !== t) { out += `\n— Turn ${c.turn} —\n`; t = c.turn; }
    out += `${c.side ? '[' + exShort(c.side) + '] ' : ''}${c.text}\n`;
  }
  return out;

  passTurn: async () => {

    if (!await confirmBox({ title: 'End the turn?', text: `<p>${esc(exName(C.active))} makes camp. Turn ${C.turn + 1} begins and <b>${esc(exName(n))}</b> marches.</p>`, ok: 'End turn' })) return;

    chron(n, 'turn', `Turn ${C.turn}: ${exName(n)} breaks camp and takes the road.`);
    save(); render(); toast(`Turn ${C.turn}: ${exShort(n)} marches`);
  },
  undoLost: async el => {
    const s = el.dataset.side;
    if (!await confirmBox({ title: 'Restore the expedition?', text: '<p>Mark the expedition as active again and set its Priest to Wounded?</p>', ok: 'Restore' })) return;

  },
  shard: el => shardsSheet(+el.dataset.i),
  editReg: el => editRegiment(el.dataset.id),

  addReg: () => { const r = reg('New Regiment', 'Halberdiers', 10, 6); EX(UI.side).regiments.push(r); editRegiment(r.id, true); },
  addChar: () => { const h = hero('New Hero', 'Captain of the Empire', 50); EX(UI.side).characters.push(h); editCharacter(h.id, true); },

  modInc: el => { const [r] = findReg(el.dataset.id); if (r && r.models < r.maxModels) { r.models++; save(); render(); } else toast('Already at full strength. Edit to raise the maximum.'); },
  rankUp: el => rankUp(el.dataset.id),
  gold: el => { const a = +el.dataset.amt; addGold(UI.side, a, a > 0 ? 'Adjustment' : 'Adjustment'); save(); render(); },

      { key: 'dir', label: 'Direction', type: 'seg', value: 'pay', options: [['pay', 'Pay out'], ['get', 'Receive']] },

    if (v.reason.trim()) chron(UI.side, 'gold', `${exName(UI.side)} ${a < 0 ? 'paid' : 'received'} ${Math.abs(a)} gc: ${v.reason.trim()}.`);
    save(); render();
  },
  patron: async () => {
    const p = S().patron, s = UI.side;
    const v = await formSheet({ title: `Payment from ${EX(s).patron}`, ok: 'Receive', fields: [

      if (g.m) { g.mode = 'drag'; g.mx0 = g.m.x; g.my0 = g.m.y; g.m.el.classList.add('lift'); this.host.classList.add('dragging'); }
    }
    if (g.mode === 'drag') {
      g.m.x = clamp(g.mx0 + dx / (this.W * this.k), 0, 1); g.m.y = clamp(g.my0 + dy / (this.H * this.k), 0, 1);
      if (g.m.follow) g.m.follow.forEach(f => { f.x = g.m.x; f.y = g.m.y; });
      this.schedule();
    } else {
      this.tx = g.tx0 + dx; this.ty = g.ty0 + dy; this.clampT(); this.schedule();

    }
  }
  cancelDrag() {
    const g = this.g; if (!g || g.mode !== 'drag') return;
    g.m.x = g.mx0; g.m.y = g.my0; if (g.m.follow) g.m.follow.forEach(f => { f.x = g.mx0; f.y = g.my0; });
    g.m.el.classList.remove('lift'); this.host.classList.remove('dragging'); this.schedule();
  }
  up(e) {
    if (!this.ptrs.has(e.pointerId)) return;
    this.ptrs.delete(e.pointerId);
    const g = this.g; if (!g) return;
    if (g.mode === 'pinch') {
      if (this.ptrs.size === 1) { const [p] = [...this.ptrs.values()]; this.g = { mode: 'pan', sx: p.x, sy: p.y, tx0: this.tx, ty0: this.ty, t0: 0, moved: true, hist: [] }; }
      else if (!this.ptrs.size) this.g = null;

    }
    if (this.ptrs.size) return;
    this.g = null;
    if (g.mode === 'drag') {
      if (e.type === 'pointercancel') return this.cancelDrag();
      g.m.el.classList.remove('lift'); this.host.classList.remove('dragging');
      if (this.o.onDragEnd) this.o.onDragEnd(g.m); return;
    }
    if (!g.moved) { if (e.type !== 'pointercancel' && performance.now() - g.t0 < 650) this.tap(g.sx, g.sy); return; }

    const a = h[0], b = h[h.length - 1], dt = b[2] - a[2];
    if (dt <= 0 || performance.now() - b[2] > 80) return;
    let vx = (b[0] - a[0]) / dt, vy = (b[1] - a[1]) / dt;
    if (Math.hypot(vx, vy) < 0.3) return;
    let last = performance.now();
    const step = now => {
      const d = Math.min(32, now - last); last = now;

    const now = performance.now(), m = this.hit(x, y);

    if (m && !dbl) { this.lastTap = null; clearTimeout(this.tapT); if (this.o.onTap) this.o.onTap({ marker: m }); return; }
    if (dbl) { clearTimeout(this.tapT); this.lastTap = null; return this.zoomAt(x, y, this.k >= this.maxK * 0.98 ? this.fitK : this.k * 2); }
    this.lastTap = { x, y, t: now };

  }
  zoomAt(x, y, k2, animate = true) {
    const wx = (x - this.tx) / this.k, wy = (y - this.ty) / this.k;
    k2 = clamp(k2, this.minK, this.maxK);
    if (!animate) { this.k = k2; this.tx = x - wx * k2; this.ty = y - wy * k2; this.clampT(); return this.schedule(); }

    this.k = k2; this.tx = x - wx * k2; this.ty = y - wy * k2; this.clampT();
    this.animateTo(from, { k: this.k, tx: this.tx, ty: this.ty });
  }
  zoomBy(f) { this.zoomAt(this.vw / 2, this.vh / 2, this.k * f); }
  fit() { const from = { k: this.k, tx: this.tx, ty: this.ty }; this.k = this.fitK; this.centerOn(0.5, 0.5); this.animateTo(from, { k: this.k, tx: this.tx, ty: this.ty }); }
  focus(fx, fy, z = 3) {
    const from = { k: this.k, tx: this.tx, ty: this.ty };
    this.k = clamp(Math.max(this.k, this.fitK * z), this.minK, this.maxK); this.centerOn(fx, fy);
    this.animateTo(from, { k: this.k, tx: this.tx, ty: this.ty });
  }
  animateTo(a, b, ms = 230) {
    this.stopAnim(); const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
      this.k = a.k + (b.k - a.k) * e; this.tx = a.tx + (b.tx - a.tx) * e; this.ty = a.ty + (b.ty - a.ty) * e;
      this.apply(); this.anim = t < 1 ? requestAnimationFrame(step) : 0;
    };
    this.anim = requestAnimationFrame(step);
  }
  wheel(e) {
    e.preventDefault(); this.rect = this.host.getBoundingClientRect();
    const p = this.local(e); this.zoomAt(p.x, p.y, this.k * Math.exp(-e.deltaY * 0.0018), false);
  }
  destroy() { this.dead = true; this.stopAnim(); if (this.raf) cancelAnimationFrame(this.raf); clearTimeout(this.tapT); this.ro.disconnect(); }
}

/* =====================================================================

   ===================================================================== */
function pinHtml(p, seals) {
  return `<div class="pin" style="background:${facColor(p.faction)}">${terrIcon(p.terrain)}${seals ? `<span class="pseal" title="Battle fought here">✠</span>` : ''}</div><div class="plabel">${esc(p.name)}</div>`;
}
function tokenHtml(s, off, small) {
  return `<div class="token side-${s}${small ? ' sm' : ''}" style="--off:${off}px">${shieldSvg(s)}</div>`;
}
const TRAIL_COL = { sig: '#e8c54a', ulr: '#eef3fa' };
function regionMarkers(r) {
  const out = [];
  for (const p of r.pins) out.push({ id: p.id, x: p.x, y: p.y, hit: true, drag: true, ref: p, cls: 'mk-pin' + (UI.pinMove === p.id ? ' moving' : ''), html: pinHtml(p, missionsAt(r.id, p.id).length) });
  const here = SIDES.filter(s => { const q = EX(s).pos; return q && q.regionId === r.id && pinOf(r, q.pinId); });
  here.forEach(s => {
    const pin = pinOf(r, EX(s).pos.pinId);
    const both = here.length === 2 && EX('sig').pos.pinId === EX('ulr').pos.pinId;
    const tok = { id: 'tok-' + s, x: pin.x, y: pin.y, hit: false, cls: 'mk-token', html: tokenHtml(s, both ? (s === 'sig' ? -15 : 15) : 0) };
    out.push(tok);
    const pm = out.find(m => m.ref === pin); (pm.follow = pm.follow || []).push(tok);
  });
  if (UI.ghost && UI.ghost.regionId === r.id) out.push({ id: 'ghost', x: UI.ghost.x, y: UI.ghost.y, hit: false, cls: 'mk-pin ghost', html: '<div class="pin" style="background:#8e1b1b">' + terrIcon('town') + '</div>' });
  return out;
}
function regionTrails(r) {
  const out = [];
  for (const s of SIDES) {
    let seg = [];
    const flush = () => { if (seg.length > 1) out.push({ color: TRAIL_COL[s], pts: seg }); seg = []; };
    for (const t of EX(s).trail) {
      if (t.regionId !== r.id) { flush(); continue; }
      const p = pinOf(r, t.pinId); const pt = p || (t.x != null ? { x: t.x, y: t.y } : null);
      if (pt) seg.push(pt);
    }
    flush();
  }
  return out;
}
function overviewMarkers() {
  const out = C.regions.map(r => ({ id: r.id, x: r.hot.x, y: r.hot.y, hit: true, drag: true, ref: r, cls: 'mk-hot' + (r.far ? ' far' : ''),
    html: `<div class="hot" style="--d:${r.danger}">${missionsAt(r.id).length ? '<span class="pseal">✠</span>' : ''}</div><div class="plabel">${esc(r.short || r.name)}</div>` }));
  const at = s => { const q = EX(s).pos; return q && regionById(q.regionId); };
  SIDES.forEach(s => {
    const r = at(s); if (!r) return;
    const both = at('sig') && at('ulr') && at('sig') === at('ulr');
    const tok = { id: 'tok-' + s, x: r.hot.x, y: r.hot.y, hit: false, cls: 'mk-token', html: tokenHtml(s, both ? (s === 'sig' ? 0 : 22) : 0, true) };
    out.push(tok); const hm = out.find(m => m.ref === r); (hm.follow = hm.follow || []).push(tok);
  });
  return out;
}
function overviewTrails() {
  return SIDES.map(s => {
    const ids = []; for (const t of EX(s).trail) if (ids[ids.length - 1] !== t.regionId) ids.push(t.regionId);
    return { color: TRAIL_COL[s], pts: ids.map(regionById).filter(Boolean).map(r => r.hot) };
  });
}

function refreshMap() { if (MV) MV.setMarkers(); else render(); }

function viewMap() {

function openRegion(id) {

  if (UI.view !== 'region') { try { history.pushState({ region: 1 }, ''); UI.regionPushed = true; } catch (e) {} }

}
function regionTap(r, marker, fx, fy) {
  if (UI.pinMove) {
    if (marker) return;
    const p = pinOf(r, UI.pinMove); UI.pinMove = null;
    if (p) { p.x = +fx.toFixed(4); p.y = +fy.toFixed(4); save(); toast(`${p.name} moved`, 1400); }
    return render();
  }
  if (marker) return UI.pinSetup ? editPin(r, marker.ref) : pinSheet(r, marker.ref);
  if (UI.pinSetup) newPin(r, fx, fy);
}
function newPin(r, fx, fy) {
  UI.ghost = { regionId: r.id, x: fx, y: fy }; refreshMap();
  editPin(r, { id: null, name: '', terrain: 'village', faction: '', x: +fx.toFixed(4), y: +fy.toFixed(4), notes: '' }, true, () => { UI.ghost = null; refreshMap(); });
}

    onMount: sh => {

      if (isNew) setTimeout(() => { try { $('[name=name]', sh.body).focus(); } catch (e) {} }, 250);

}
function pinSheet(r, p) {

      ${fought.length ? `<h3 class="sc" style="margin-top:12px">Battles fought here</h3>${fought.map(m => `<div class="listed small"><span class="wax">✠</span><span class="grow">${esc(m.name || 'Battle')} · ${esc(exShort(m.side))} · ${esc(m.result || '')}</span><span class="muted">T${m.turn || '?'}</span></div>`).join('')}` : ''}

function marchTo(s, r, p) {
